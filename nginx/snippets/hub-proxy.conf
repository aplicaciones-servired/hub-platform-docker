# Cabeceras comunes al proxear hacia la red interna de Docker.
# TLS lo termina Cloudflare, por eso X-Forwarded-Proto va Fijado a https:
# el backend responde 301 a https:// si x-forwarded-proto != "https"
# (backend/src/index.ts), y con $scheme (http dentro del túnel) eso sería un
# bucle de redirección en el navegador.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_buffering       on;
proxy_buffer_size     8k;
proxy_buffers         16 16k;

# No reintentar POST contra otro upstream: el backend no es idempotente.
proxy_next_upstream error timeout;
