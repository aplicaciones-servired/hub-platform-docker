# Configuración principal de nginx para el edge de HUB (contenedor `edge`).
# TLS lo termina Cloudflare Tunnel; aquí solo HTTP en la red interna de Docker.
# Validar siempre con `nginx -t` antes de recargar.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # En la imagen oficial de nginx, /var/log/nginx/{access,error}.log son
    # symlinks a /dev/stdout y /dev/stderr: por eso `docker compose logs edge`
    # muestra las peticiones sin montar ningún volumen.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    client_max_body_size 8m;   # uploads: multer limita a 5 MB
    client_body_timeout  30s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1000;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml application/rss+xml image/svg+xml font/woff2;

    # Solo confían en estos peers las cabeceras CF-Connecting-IP / X-Forwarded-*.
    # El contenedor edge NO se publica fuera de 127.0.0.1:8080, así que aquí no
    # hay peptón de internet capaz de inyectar la IP real.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    # WebSocket / upgrade para los location que lo necesiten.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Configuración de los hostnames (soporte.* / app.*).
    include /etc/nginx/conf.d/*.conf;
}
