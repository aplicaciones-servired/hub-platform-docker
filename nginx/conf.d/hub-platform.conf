# ─────────────────────────────────────────────────────────────────────────────
#  HUB AI Assistant — edge reverse proxy
#  TLS termina en Cloudflare Tunnel. El túnel corre como contenedor en la red
#  externa `red-gane-int` y entra aquí por DNS (http://hub-edge:8080); este
#  contenedor no publica ningún puerto en el host.
#  Archivos montados por deploy/docker-compose.prod.yml:
#      nginx/nginx.conf            → /etc/nginx/nginx.conf
#      nginx/conf.d/               → /etc/nginx/conf.d/
#      nginx/snippets/             → /etc/nginx/snippets/
#  Tras cambiarlos:
#      docker compose -p hub exec edge nginx -t
#      docker compose -p hub exec edge nginx -s reload
#
#  Hostnames:
#    soporte.serviredgane.cloud → dashboard Next.js (web:3000)
#    app.serviredgane.cloud     → PWA móvil Expo   (mobile:8081)
#
#  /api y /uploads van SIEMPRE directo a api:3001 (nunca por Next ni por el
#  nginx del contenedor mobile): el backend usa `trust proxy = 1`, así que con
#  dos saltos aplicados a mano su rate limiter vería siempre la IP del contenedor
#  y bloquearía a todos los usuarios por igual.
#
#  Los upstreams se resuelven por variable + `resolver`, no por nombre estático:
#  nginx resuelve los nombres UNA vez al arrancar, así que con `proxy_pass
#  http://api:3001` se queda con la IP vieja cuando un `docker compose up`
#  recrea el contenedor y devuelve 502 hasta que se recargue. Mismo truco que
#  mobile/nginx.conf.
#
#  No hay cache de /api a propósito: las respuestas dependen de la cookie de
#  sesión y una entrada mal cacheada serviría el dato de un usuario a otro.
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=hub_api:10m     rate=30r/s;
limit_req_zone $binary_remote_addr zone=hub_static:10m rate=100r/s;

# DNS interno de Docker. `valid=10s` recalcula la IP cada 10 s como máximo.
resolver 127.0.0.11 valid=10s ipv6=off;

# Host desconocido (acceso por IP o Host manipulado) → se corta sin responder.
# El backend solo valida ALLOWED_HOSTS en su redirect a HTTPS, no en cada
# petición: cerrar aquí evita incluso el 400 y no filtra que el proxy existe.
# Nota: con el túnel en contenedor, CF-Connecting-IP siempre llega desde la red
# interna (10/8, 172.16/12, 192.168/16 declaradas en nginx.conf).
server {
    listen 8080 default_server;
    server_name _;
    access_log off;

    # Sonda del healthcheck de Docker. Solo desde dentro del contenedor: el
    # túnel entra con la IP del bridge, no con 127.0.0.1.
    location = /nginx-health {
        allow 127.0.0.1;
        deny  all;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# ═══ Dashboard: soporte.serviredgane.cloud ═════════════════════════════════
server {
    listen 8080;
    server_name soporte.serviredgane.cloud;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Única sonda pública. /api/health/db y /api/metrics exigen cookie admin:
    # no usarlas para monitorización externa.
    location = /api/health {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
    }

    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        proxy_read_timeout 120s;   # el chatbot puede tardar
        limit_req zone=hub_api burst=60 nodelay;
        limit_req_status 429;
    }

    # Archivos subidos (multer, máx 5 MB); requiere cookie admin.
    location /uploads/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        proxy_read_timeout 120s;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        proxy_read_timeout 60s;
    }
}

# ═══ PWA móvil: app.serviredgane.cloud ══════════════════════════════════════
server {
    listen 8080;
    server_name app.serviredgane.cloud;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # El contenedor mobile ya envía este mismo valor; un duplicado idéntico es inocuo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/health {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
    }

    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        proxy_read_timeout 120s;
        limit_req zone=hub_api burst=60 nodelay;
        limit_req_status 429;
    }

    location /uploads/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        proxy_read_timeout 120s;
    }

    # Bundles de Expo: el nombre lleva hash, se pueden cachear un mes.
    # Solo `expires` (no `add_header`) para no perder los headers de seguridad
    # heredados del server block: cualquier `add_header` en el location anula la
    # herencia de TODOS los del nivel superior.
    location /_expo/static/ {
        set $mobile_upstream http://mobile:8081;
        proxy_pass $mobile_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        expires 30d;
    }

    location /assets/ {
        set $mobile_upstream http://mobile:8081;
        proxy_pass $mobile_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        expires 30d;
    }

    location / {
        set $mobile_upstream http://mobile:8081;
        proxy_pass $mobile_upstream;
        include /etc/nginx/snippets/hub-proxy.conf;
        limit_req zone=hub_static burst=200 nodelay;
        limit_req_status 429;
    }
}
