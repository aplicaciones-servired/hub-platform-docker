limit_req_zone $binary_remote_addr zone=apilimit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=staticlimit:10m rate=100r/s;

server {
    listen 8081;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # IP real del cliente: cloudflared (en el host/red privada) pasa CF-Connecting-IP.
    # Solo peers internos son confiables; sin ese header nginx usa $remote_addr.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 'unsafe-inline' solo en style-src: React Native Web inyecta las hojas de
    # estilo en runtime (createSheet, configureWebLayoutAnimations) y las fuentes
    # vía loadSingleFontAsync. El <style>/<script> inline estático del index.html
    # sí se externaliza en el build (Dockerfile.web → extract-inline.sh), pero los
    # estilos dinámicos no se pueden extraer a archivo. script-src sigue estricto.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'" always;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        limit_req zone=apilimit burst=30 nodelay;
    }

    location / {
        try_files $uri $uri/ /index.html;
        limit_req zone=staticlimit burst=200 nodelay;
    }
}
